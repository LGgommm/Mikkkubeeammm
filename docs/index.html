<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매물 알림</title>
<style>*{box-sizing:border-box}body{max-width:650px;margin:32px auto;padding:16px;background:#faf8f4;color:#202922;font:16px/1.6 system-ui}section{background:white;border:1px solid #d9dfd9;border-radius:12px;padding:18px;margin:14px 0}button,select,input{font:inherit;padding:8px;margin:3px;border:1px solid #abb7ac;border-radius:6px}button{background:#275440;color:white}a{color:#245441}li{margin:.65em 0}small{display:block}body{background:#fff;color:#191919;margin:0 auto}section{border:0;border-top:1px solid #eee;border-radius:0;padding:14px 0}h1{font-size:26px}h2{font-size:20px}form{display:flex;flex-wrap:wrap}input{min-width:100px;flex:1}#hits,#stars{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px;padding:0}#hits li,#stars li{position:relative;margin:0;min-width:0}#hits a,#stars a{display:block;color:inherit;text-decoration:none}.thumb{position:relative;display:grid;place-items:center;aspect-ratio:1;background:#f5f5f5;border-radius:16px;overflow:hidden;color:#747474;font-size:13px}.thumb img{position:absolute;width:100%;height:100%;object-fit:contain;background:#f5f5f5}.item-title{margin:9px 0 3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.4}li strong{font-size:20px}#hits li button,#stars li button{position:absolute;right:7px;top:0;transform:translateY(-115%);margin-top:100%;background:#fffffff0;color:#222;border:0;border-radius:16px;font-size:12px;padding:5px 10px}</style>
<h1>매물 알림</h1><section><h2>키워드 설정</h2><form id="form"><select id="shop" aria-label="판매처"><option value="mercari">메루카리</option><option value="nakano">만다라케</option></select><input id="word" aria-label="키워드" placeholder="예: けいおん" required maxlength="80"><button>키워드 등록</button></form><small>첫 확인 이후 새로 발견한 상품을 알려줘요.</small><ul id="watches"></ul></section>
<section><h2>알림 목록</h2><button id="reload">새로고침</button><p id="status" role="status"></p><ul id="hits"></ul></section><section><h2>찜 목록</h2><small>이 브라우저에서 추가한 찜을 볼 수 있어요.</small><ul id="stars"></ul></section><script src="./config.js"></script><script src="./market.js"></script></html>
