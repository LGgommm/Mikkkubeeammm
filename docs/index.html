<script>
  const darkAppearance = matchMedia('(prefers-color-scheme: dark)');
  function updateStatusBar() {
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
      darkAppearance.matches ? 'black-translucent' : 'default';
  }
  updateStatusBar();
  darkAppearance.addEventListener('change', updateStatusBar);
</script>

<style>
  .feed-tools,#filter-dialog header,#filter-dialog footer,.filter-range,.filter-choices {display:flex;align-items:center;gap:8px}
  .feed-tools {margin-left:auto}
  #feed-filter {display:grid;place-items:center;width:34px;height:34px;min-height:34px;padding:0;border-radius:50%}
  #feed-filter svg {width:16px;height:16px}
  #feed-filter.active,#filter-done,.filter-choices button[aria-pressed=true] {background:var(--blue);color:var(--card)}
  #filter-dialog {width:min(380px,calc(100% - 32px));max-height:80dvh;padding:18px;border:0;border-radius:22px;color:var(--ink);background:var(--card)}
  #filter-dialog::backdrop {background:#0007}
  #filter-dialog header {flex-direction:row;justify-content:space-between}
  #filter-title {font-size:18px;color:var(--ink)}
  #filter-close {min-height:34px;width:34px;padding:0;border-radius:50%;font-size:22px}
  .filter-section {margin-top:9px;border-radius:18px;background:var(--fill);overflow:hidden}
  .filter-section>button {display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;color:var(--ink);background:transparent;font-weight:600;text-align:start}
  .filter-section>button::after {content:'';width:7px;height:7px;border:solid var(--sub);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .18s}
  .filter-section>button[aria-expanded=true]::after {transform:rotate(225deg)}
  .filter-panel {display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
  .filter-panel:not([inert]) {grid-template-rows:1fr}
  .filter-panel>div {min-height:0;overflow:hidden}
  .filter-panel .filter-range,.filter-panel .filter-choices {padding:2px 12px 12px}
  .filter-panel input,.filter-panel .filter-choices button:not([aria-pressed=true]) {background:var(--card)}
  @media(prefers-reduced-motion:reduce){.filter-panel,.filter-section>button::after {transition:none}}
  .filter-range input {min-width:0;width:40%;-webkit-tap-highlight-color:transparent}
  #filter-dialog .filter-range input:focus {outline:none;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
  .filter-choices {flex-wrap:wrap}
  .filter-choices button {min-height:34px;border-radius:999px;overflow-wrap:anywhere;max-width:100%}
  #filter-dialog footer {justify-content:space-between;margin-top:18px}
  .list-controls { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:20px; }
  .page-tabs { display:flex; gap:8px; }
  #add-keyword { flex:none; width:44px; height:44px; padding:0; border:1px solid var(--fill); border-radius:50%; display:grid; place-items:center; background:var(--card); color:var(--ink); }
  #keyword-dialog { width:min(420px,calc(100% - 32px)); max-height:80dvh; overflow:auto; border:0; border-radius:22px; padding:20px; background:var(--card); color:var(--ink); }
  #keyword-dialog::backdrop { background:rgb(0 0 0 / 48%); }
  @media (prefers-reduced-motion: no-preference) {
    #keyword-dialog[open] { animation: keyword-enter 200ms ease-out; }
    #keyword-dialog[open]::backdrop { animation: keyword-dim 200ms ease-out; }
    #keyword-dialog[open].closing { animation:keyword-exit 160ms ease-in both; }
    #keyword-dialog[open].closing::backdrop { animation:keyword-undim 160ms ease-in both; }
    @keyframes keyword-exit { to { opacity:0; transform:translateY(10px); } }
    @keyframes keyword-undim { to { opacity:0; } }
    @keyframes keyword-enter {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }
    @keyframes keyword-dim { from { opacity:0; } to { opacity:1; } }
  }
  #keyword-dialog label { display:block; font-weight:650; }
  #keyword-dialog input { flex:1; min-width:0; min-height:34px; padding:0; background:transparent; }
  #keyword-dialog form { display:flex; align-items:center; flex-wrap:nowrap; gap:3px; padding:3px 4px; margin:6px 0 4px; border-radius:999px; background:var(--fill); }
  #keyword-dialog button[type="submit"] { flex:none; padding:0 12px; min-height:34px; font-size:14px; color:#171719; background:white; font-weight:650; box-shadow:0 0 0 1px #0001; }
  #current-shop { display:block; margin:0 8px 18px; }
  #keyword-dialog select { flex:1; }
  #watches { display:grid; gap:8px; list-style:none; padding:0; margin:10px 0 16px; }
  #watches > li { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:4px; padding:7px 8px; border-radius:18px; background:var(--fill); color:var(--ink); }
  .watch-logos { display:flex; align-items:center; padding-right:4px; }
  .watch-logos img { box-sizing:border-box; display:block; width:26px; height:26px; border-radius:50%; padding:3px; border:1px solid var(--sub); background:white; object-fit:contain; }
  .watch-logos img + img { margin-left:-8px; }
  .watch-keyword { overflow-wrap:anywhere; }
  #watches button { display:grid; place-items:center; width:36px; min-height:36px; margin:0; padding:0; border-radius:50%; background:var(--card); color:var(--ink); }
  #keyword-dialog #word:focus { outline:none; box-shadow:none; }
  #keyword-dialog label[for="word"]:focus { outline:none; }
  #close-keywords { width:100%; border-radius:999px; }
  .page-tabs button { border-radius:999px; padding:9px 20px; background:var(--card); color:var(--ink); font-weight:600; }
  .page-tabs button[aria-selected="true"] { background:var(--ink); color:var(--card); }
  .page-track { display:flex; align-items:flex-start; overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none; min-height:32vh; }
  .page-track::-webkit-scrollbar { display:none; }
  .page-track > section { flex:0 0 100%; min-width:0; scroll-snap-align:start; scroll-snap-stop:always; }
  .page-track > section[inert] { max-height:32vh; overflow:hidden; }
</style>
<style>
  button, #keyword-dialog select { border-radius:999px; }
  svg { stroke-linecap:round; stroke-linejoin:round; }
  summary { display:flex; align-items:center; gap:8px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  .chevron { flex:none; color:var(--sub); }
  details[open] > summary .chevron { transform:rotate(90deg); }
  #form { position:relative; }
  .shop-picker { display:grid; place-items:center; width:36px; height:34px; min-height:0; flex:none; border:0; padding:0; color:var(--ink); background:transparent; -webkit-tap-highlight-color:transparent; }
  .shop-picker:focus { outline:0; box-shadow:none; }
  .shop-picker:focus-visible { color:var(--blue); }
  #shop-menu { position:absolute; top:calc(100% + 5px); left:0; z-index:2; }
  :is(#shop-menu,#edit-shops,#filter-shops) { width:min(258px,100%); padding:6px; border-radius:20px; background:var(--card); box-shadow:0 4px 22px #0004,0 0 0 1px var(--fill); }
  :is(#shop-menu,#edit-shops,#filter-shops) label { cursor:pointer; min-height:44px; font-weight:500; display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:6px 10px; background:transparent; color:var(--ink); }
  :is(#shop-menu,#edit-shops,#filter-shops) label:active { background:var(--fill); }
  .store-icon { flex:none; width:24px; height:24px; object-fit:contain; border-radius:6px; }
  :is(#shop-menu,#edit-shops,#filter-shops) input[type="checkbox"] { appearance:auto; flex:none; min-height:0; width:18px; height:18px; margin:0 0 0 auto; accent-color:var(--blue); }
  @media (prefers-reduced-motion:no-preference) {
    #shop-menu:not([hidden]) { animation:shop-appear 150ms ease-out; transform-origin:top left; }
    @keyframes shop-appear { from { opacity:0; transform:translateY(-3px) scale(.97); } to { opacity:1; transform:none; } }
  }
</style>
<style>
  .watch-options { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:5px; }
  #watches .watch-options button { width:auto; min-height:32px; padding:4px 12px; border-radius:999px; font-size:13px; }
  .watch-panel { grid-column:1/-1; display:grid; grid-template-rows:0fr; transition:grid-template-rows .2s ease; }
  .watch-panel.expanded { grid-template-rows:1fr; }
  .panel-body { overflow:hidden; min-height:0; }
  #keyword-dialog #editor-form { display:grid; margin:0; padding:6px 2px; gap:6px; background:transparent; border-radius:0; }
  #filter-dialog #filter-shops {width:100%;margin:0;background:var(--fill);box-shadow:none}
  #filter-shops input[type="checkbox"] {min-width:0;padding:0}
  #keyword-dialog #edit-shops { width:100%; min-width:0; margin:0; }
  .price-values { display:flex; align-items:baseline; justify-content:flex-start; gap:5px; font-size:15px; font-weight:600; }
  #keyword-dialog .price-values input { flex:none; min-width:2ch; max-width:11ch; min-height:32px; padding:0; font:inherit; font-variant-numeric:tabular-nums; border-radius:0; }
  #keyword-dialog .price-values input:focus { outline:none; border-bottom:1px solid var(--blue); }
  #editor-form footer { display:flex; justify-content:flex-end; gap:6px; }
  #watches #editor-form footer button { width:auto; padding:4px 12px; border-radius:999px; }
  .price-track { position:relative; height:36px; margin:4px 8px; }
  .price-track::before { content:''; position:absolute; inset:16px 0; border-radius:8px; background:linear-gradient(to right,var(--sub) var(--lo),var(--blue) var(--lo) var(--hi),var(--sub) var(--hi)); }
  #keyword-dialog .price-track input { position:absolute; inset:0; width:100%; height:36px; appearance:none; pointer-events:none; margin:0; border:0; background:transparent; }
  .price-track input::-webkit-slider-thumb { appearance:none; pointer-events:auto; width:22px; height:22px; border-radius:50%; background:var(--card); border:2px solid var(--blue); cursor:grab; }
  .price-track input::-moz-range-thumb { pointer-events:auto; width:20px; height:20px; border-radius:50%; background:var(--card); border:2px solid var(--blue); }
  @media(prefers-reduced-motion:reduce){ .watch-panel { transition:none; } }
</style>

<script>
  for(const bar of document.querySelectorAll('.filter-section>button')) {
    const panel=document.getElementById(bar.getAttribute('aria-controls'));
    function expand(open) {
      bar.setAttribute('aria-expanded',String(open));
      panel.inert=!open;
    }
    bar.addEventListener('click',()=>expand(panel.inert));
    panel.addEventListener('invalid',()=>expand(true),true);
    document.getElementById('filter-dialog').addEventListener('close',()=>expand(false));
  }
  const shopMenu = document.getElementById('shop-menu');
  const trigger = document.getElementById('shop-trigger');
  const submitKeyword = document.querySelector('#form button[type="submit"]');
  function setMenu(open) {
    shopMenu.hidden = !open;
    trigger.setAttribute('aria-expanded', String(open));
  }
  function showSelection() {
    const names = Array.from(shopMenu.querySelectorAll('input:checked'), box => box.labels[0].querySelector('.store-name').textContent);
    document.getElementById('current-shop').textContent = names.length ? '판매처 · ' + names.join(', ') : '상점을 하나 이상 선택해 주세요.';
    submitKeyword.disabled = !names.length;
  }
  showSelection();
  shopMenu.addEventListener('change', showSelection);
  trigger.addEventListener('click', () => setMenu(shopMenu.hidden));
  document.addEventListener('pointerdown', event => {
    if (!shopMenu.hidden && !shopMenu.contains(event.target) && !trigger.contains(event.target)) setMenu(false);
  });
  const keywordDialog = document.getElementById('keyword-dialog');
  document.getElementById('add-keyword').addEventListener('click', () => keywordDialog.showModal());
  async function closeKeywords() {
    if (!keywordDialog.open || keywordDialog.classList.contains('closing')) return;
    setMenu(false);
    keywordDialog.classList.add('closing');
    const exit = keywordDialog.getAnimations().find(animation => animation.animationName === 'keyword-exit');
    if (exit) await exit.finished.catch(() => {});
    keywordDialog.close();
    keywordDialog.classList.remove('closing');
  }
  document.getElementById('close-keywords').addEventListener('click', closeKeywords);
  keywordDialog.addEventListener('cancel', event => {
    event.preventDefault();
    if (shopMenu.hidden) closeKeywords();
    else { setMenu(false); trigger.focus(); }
  });
  const track = document.querySelector('.page-track');
  const tabs = Array.from(document.querySelectorAll('.page-tabs button'));
  function markPage(index) {
    tabs.forEach((tab, i) => {
      const selected = i === index;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      track.children[i].inert = !selected;
    });
  }
  function showPage(index) {
    track.scrollTo({left: index * track.clientWidth, behavior: 'instant'});
    markPage(index);
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => showPage(index));
    tab.addEventListener('keydown', event => {
      const targets = {ArrowLeft: 1-index, ArrowRight: 1-index, Home: 0, End: 1};
      if (!(event.key in targets)) return;
      event.preventDefault();
      const next = targets[event.key];
      showPage(next);
      tabs[next].focus();
    });
  });
  track.addEventListener('scroll', () => {
    markPage(track.scrollLeft >= track.clientWidth / 2 ? 1 : 0);
  }, {passive:true});
</script>
