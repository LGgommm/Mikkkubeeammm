<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.json"><title>만다라케 입고 알림</title>
<style>*{box-sizing:border-box}body{margin:36px auto;padding:16px;max-width:550px;background:#faf8f4;color:#232823;font:16px/1.6 system-ui}h1{letter-spacing:-.08em}section{background:white;border:1px solid #deded6;border-radius:14px;padding:20px;margin:14px 0}label{display:block;font-weight:650}input,button{font:inherit;padding:10px;border-radius:8px;margin:5px 0}input{width:100%;border:1px solid #aaa}button{border:0;background:#234c3b;color:white;cursor:pointer}a{color:#234c3b}small{color:#565c56}</style>
<h1>만다라케 입고 알림</h1><p>나카노점 · 5분마다 확인</p>
<section><label for="server">알림 서버 HTTPS 주소</label><input id="server" type="url" placeholder="https://"><small>5분 수집과 푸시를 실행할 개인 서버 주소를 입력하세요.</small><label for="key">개인 접속 키</label><input id="key" type="password"><button id="connect">연결</button></section>
