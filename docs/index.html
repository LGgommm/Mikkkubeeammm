<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매물 알림</title>
<style>*{box-sizing:border-box}body{max-width:650px;margin:32px auto;padding:16px;background:#faf8f4;color:#202922;font:16px/1.6 system-ui}section{background:white;border:1px solid #d9dfd9;border-radius:12px;padding:18px;margin:14px 0}button,select,input{font:inherit;padding:8px;margin:3px;border:1px solid #abb7ac;border-radius:6px}button{background:#275440;color:white}a{color:#245441}li{margin:.65em 0}small{display:block}body{background:#fff;color:#191919;margin:0 auto}section{border:0;border-top:1px solid #eee;border-radius:0;padding:14px 0}h1{font-size:26px}h2{font-size:20px}form{display:flex;flex-wrap:wrap}input{min-width:100px;flex:1}
#hits, #stars {list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:0}
:is(#hits,#stars) li {position:relative;margin:0;border:1px solid #e2e5e9;border-radius:9px;overflow:hidden}
:is(#hits,#stars) a {display:grid;grid-template-columns:clamp(92px,29%,155px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:5px 13px;padding:14px;color:inherit;text-decoration:none}
.thumb {grid-row:1 / 3;position:relative;display:grid;place-items:center;aspect-ratio:3 / 4;background:#f6f6f6;border-radius:5px;overflow:hidden;color:#747474;font-size:13px}
.thumb img {position:absolute;width:100%;height:100%;object-fit:contain;background:#f6f6f6}
.item-title {align-self:start;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;line-height:1.45}
:is(#hits,#stars) strong {align-self:start;font-size:20px;color:#2477cf}
:is(#hits,#stars) li button {position:absolute;left:5px;top:5px;margin:0;padding:4px 9px;min-height:30px;border:1px solid #ddd;border-radius:18px;background:white;color:#353535;font-size:12px;box-shadow:0 1px 4px #0002}

body{padding:0 12px 24px}
header{margin:0 -12px 14px;background:#61a5d3;padding:12px}
header h1{margin:0 0 8px;color:white;font-size:18px}
header form{align-items:center;flex-wrap:nowrap;padding:3px 6px;background:white;border-radius:24px}
header form>*{margin:0;border:0;font-size:14px}
header select{max-width:29%;background:white}
header input{min-width:0;width:100%;background:transparent}
header button{flex:none;background:#22648f;color:white;border-radius:18px}
header small{margin:7px 4px 0;color:#102c40}
#watch-settings{padding:3px 0 10px}summary{cursor:pointer}
section{padding:10px 0;margin:8px 0}section h2{margin:0 0 5px}
#hits:has(>li),#stars:has(>li){margin-top:8px}
</style>
<header><h1>매물 알림</h1><form id="form"><select id="shop" aria-label="판매처"><option value="mercari">메루카리</option><option value="nakano">만다라케</option></select><input id="word" aria-label="키워드" placeholder="예: けいおん" required maxlength="80"><button>키워드 등록</button></form><small>첫 확인 이후 새로 발견한 상품을 알려줘요.</small></header><details id="watch-settings"><summary>등록한 키워드 관리</summary><ul id="watches"></ul></details>
<section><h2>알림 목록</h2><button id="reload">새로고침</button><p id="status" role="status"></p><ul id="hits"></ul></section><section><h2>찜 목록</h2><small>이 브라우저에서 추가한 찜을 볼 수 있어요.</small><ul id="stars"></ul></section><script src="./config.js"></script><script src="./market.js?v=list-2"></script></html>
