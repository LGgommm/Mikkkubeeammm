name: Market keyword alerts
on:
  push:
    branches: [main]
    paths: [watch.py, .github/workflows/watch.yml, docs/config.js]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-watch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mercapi==0.5.0 requests
      - name: Prepare collector credentials
        env:
          DEPLOY_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'CODE'
          import os, json, hashlib, hmac
          from pathlib import Path
          key = hmac.new(os.environ["DEPLOY_KEY"].strip().encode(), b"market-alert-collector-v1", hashlib.sha256).hexdigest()
          print("::add-mask::" + key)
          url = json.loads(Path("docs/config.js").read_text().split("=",1)[1].strip().rstrip(";"))
          with open(os.environ["GITHUB_ENV"],"a") as out:
              print("MARKET_API="+url,"COLLECTOR_TOKEN="+key,sep="\n",file=out)
          CODE
      - run: python watch.py
      - name: Check live collection and web app results
        if: github.event_name == 'push'
        run: |
          pip install -q selenium
          python - <<'PY'
          import asyncio, os, secrets
          import requests
          import watch
          base = os.environ['MARKET_API']
          errors = []
          for shop in ('mercari', 'nakano'):
              client = requests.Session()
              device_key = secrets.token_hex(32)
              client.headers['Authorization'] = 'Bearer ' + device_key
              def api(path, body=None):
                  resp = client.request('GET' if body is None else 'POST', base + path, json=body, timeout=30)
                  resp.raise_for_status()
                  return resp.json()
              test_id = None
              try:
                  assert api('/state')['watches'] == []
                  keyword = 'けいおん' if shop == 'mercari' else watch.nakano()[0][1][:20].strip()
                  api('/watch', {'shop':shop, 'keyword':keyword})
                  [created] = api('/state')['watches']
                  assert (created['shop'], created['keyword']) == (shop, keyword)
                  test_id = created['id']
                  result = requests.post(base + '/collector/results', headers={'Authorization':'Bearer ' + os.environ['COLLECTOR_TOKEN']}, json={'id':test_id, 'rows':[]}, timeout=30)
                  result.raise_for_status()
                  asyncio.run(watch.run())
                  state = api('/state')
                  assert state['watches'][0]['initialized'] and state['hits'], 'No live matches'
                  print(shop, 'verified live matches:', len(state['hits']))
                  if shop == 'nakano':
                      from selenium import webdriver
                      from selenium.webdriver.support.ui import WebDriverWait
                      options = webdriver.ChromeOptions()
                      options.add_argument('--headless=new')
                      with webdriver.Chrome(options=options) as browser:
                          browser.get('https://lggommm.github.io/Mikkkubeeammm/')
                          browser.execute_script("localStorage.setItem('market-device', arguments[0])", device_key)
                          browser.refresh()
                          hit = state['hits'][0]
                          WebDriverWait(browser, 30).until(lambda driver: any(
                              a.get_attribute('href') == hit['url'] and hit['title'] in a.text
                              for a in driver.find_elements('css selector', '#hits a')))
                          print('Rendered Nakano listing:', hit['title'], hit['url'])
              except Exception as exc:
                  print(shop, type(exc).__name__, str(exc)[:200])
                  errors.append(shop)
              finally:
                  if test_id is not None:
                      api('/delete', {'id':test_id})
          if errors:
              raise SystemExit('Failed: ' + ', '.join(errors))
          PY
